

# Rocky publishes a stable ".latest." name alongside the datestamped
# builds, so this URL does not rot when a point release lands.
#
# NO sshfs: fuse-sshfs is not in Rocky's BaseOS or AppStream for 9 or 10
# (probed against the package listings -- it lives in EPEL, and pulling a
# third-party repo into the shipped image is not something a base image
# should do). rsync, nfs-utils and tree ARE in BaseOS, so everything else
# in VM_SYNC_METHODS is real.
VM_VHD_LINK="https://download.rockylinux.org/pub/rocky/9/images/ppc64le/Rocky-9-GenericCloud-Base.latest.ppc64le.qcow2"
VM_OS_NAME="rocky"
VM_SSH_PORT=2222
VM_RELEASE=9

VM_ROOT_PASSWORD=anyvm.org

VM_LOGIN_TAG="login:"

VM_SHUTDOWN_CMD="shutdown -h now"

VM_INSTALL_CMD="dnf install -y "

VM_RSYNC_PKG="rsync"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG nfs-utils"

# The cloud image's pre-baked dnf metadata is a point-in-time snapshot and
# goes stale as soon as a point release rolls, so the install step refreshes
# it first (see hooks/vm_installpkgs.sh).
VM_INSTALL_SCRIPT="hooks/vm_installpkgs.sh"

VM_ARCH=ppc64le
VM_NIC=virtio

# The cloud image has no console password and no SSH key out of the box.
# hooks/host_prepareImage.sh bakes in root SSH access with virt-customize
# before the first boot (and relabels for SELinux, which this family runs
# enforcing); hooks/host_waitForLoginTag.sh and hooks/host_enablessh.sh then
# drive the rest over SSH, so we stay on the serial console instead of
# fragile VNC OCR.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="rsync,scp,nfs,tar"
